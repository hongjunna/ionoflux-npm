name: npm-stage package
on:
  push:
    tags: ['npm-stage-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-stage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      filename: ${{ steps.digest.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify source and publication prerequisites
        if: github.event_name == 'push'
        run: npm run release:gate
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:package
      - run: npm run release:verify
      - id: digest
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json'));
          const m = JSON.parse(readFileSync(`.github/release/${pkg.version}.json`));
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${m.sha256}\nfilename=${m.filename}\n`);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: npm-stage-package
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'push' && github.repository == 'hongjunna/ionoflux-npm'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm-stage
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifacts
      - name: Verify downloaded tarball against reviewed digest
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          PACKAGE_FILE: ${{ needs.build.outputs.filename }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const name = process.env.PACKAGE_FILE;
          assert.match(name, /^ionoflux-\d+\.\d+\.\d+\.tgz$/);
          const actual = createHash('sha256').update(readFileSync(`artifacts/${name}`)).digest('hex');
          assert.equal(actual, process.env.EXPECTED_SHA256);
          JS
      - name: Submit reviewed package
        env:
          PACKAGE_FILE: ${{ needs.build.outputs.filename }}
        run: npm stage publish "artifacts/$PACKAGE_FILE" --access public --registry=https://registry.npmjs.org/ --ignore-scripts
